<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duck Watch demo</title>
<!-- Exempel-app. Ersätt hela den här mappen med din Expo web-export (npx expo export --platform web). -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,system-ui,sans-serif;background:#F4F1FA;color:#1A1A19;overflow:hidden}
.feed{height:100%;overflow-y:auto;padding:58px 14px 40px;scroll-snap-type:y proximity}
.feed h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0 4px 4px}
.feed .sub{color:#6E6A78;font-size:14px;margin:0 4px 16px}
.post{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.post .who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:10px}
.post .av{width:26px;height:26px;border-radius:50%}
.post .img{height:150px;border-radius:12px}
.meter{position:absolute;top:14px;left:14px;right:14px;height:6px;border-radius:3px;background:rgba(0,0,0,.08);z-index:3}
.meter i{display:block;height:100%;width:0;border-radius:3px;background:#FF7A2F;transition:width .2s}
.duck{position:absolute;right:10px;bottom:10px;width:70px;z-index:4;transform-origin:100% 100%;
  transform:scale(var(--s,1));transition:transform .35s cubic-bezier(.3,1.3,.5,1);pointer-events:none}
.lock{position:absolute;inset:0;z-index:5;background:#FFC531;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;text-align:center;padding:30px;opacity:0;visibility:hidden;transition:.3s}
.lock.on{opacity:1;visibility:visible}
.lock svg{width:130px}
.lock h2{font-size:24px;font-weight:800}
.lock p{font-size:15px}
.lock button{margin-top:10px;font:inherit;font-weight:700;border:0;border-radius:12px;background:#1A1A19;color:#fff;padding:12px 18px}
</style>
</head>
<body>
<div class="meter"><i id="bar"></i></div>
<div class="feed" id="feed">
  <h1>Flödet</h1>
  <p class="sub">Scrolla. Ankan håller koll.</p>
</div>
<svg class="duck" id="duck" viewBox="0 0 120 110"><use href="#d"/></svg>
<div class="lock" id="lock">
  <svg viewBox="0 0 120 110"><use href="#d"/></svg>
  <h2>Dags för en paus</h2>
  <p>Du har scrollat länge nog. Lägg ifrån dig telefonen en stund.</p>
  <button id="ok">Okej, ankan</button>
</div>
<svg width="0" height="0" style="position:absolute">
  <symbol id="d" viewBox="0 0 120 110">
    <path d="M18 70c0-20 18-30 42-30 14 0 22-6 24-16 4 2 8 8 8 16 0 6-2 10-2 10 10 2 14 10 12 20-3 16-20 26-44 26-24 0-40-10-40-26Z" fill="#FFC531" stroke="#1A1A19" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="74" cy="30" r="22" fill="#FFC531" stroke="#1A1A19" stroke-width="4"/>
    <path d="M92 32c8-2 18 0 22 4-4 5-14 7-22 5" fill="#FF7A2F" stroke="#1A1A19" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="80" cy="25" r="7" fill="#fff" stroke="#1A1A19" stroke-width="3"/>
    <circle cx="82" cy="25" r="3.4" fill="#1A1A19"/>
    <path d="M34 66c8 10 26 12 38 4" fill="none" stroke="#1A1A19" stroke-width="4" stroke-linecap="round"/>
  </symbol>
</svg>
<script>
const feed=document.getElementById("feed"),duck=document.getElementById("duck"),bar=document.getElementById("bar"),lock=document.getElementById("lock");
const hues=[265,170,30,330,200,45];const names=["Ella","Omar","Sanna","Linus","Mira","Noah"];
function add(n){for(let i=0;i<n;i++){const k=feed.children.length%6;const p=document.createElement("div");p.className="post";
  p.innerHTML=`<div class="who"><span class="av" style="background:hsl(${hues[k]} 60% 70%)"></span>${names[k]}</div><div class="img" style="background:linear-gradient(135deg,hsl(${hues[k]} 70% 80%),hsl(${(hues[k]+40)%360} 70% 65%))"></div>`;feed.appendChild(p);}}
add(12);
let heat=0,last=0,idle;
feed.addEventListener("scroll",()=>{
  if(feed.scrollTop+feed.clientHeight>feed.scrollHeight-400)add(6);
  const d=Math.abs(feed.scrollTop-last);last=feed.scrollTop;
  heat=Math.min(1,heat+d/5000);draw();
  if(heat>=1){lock.classList.add("on");}
  clearTimeout(idle);idle=setTimeout(cool,700);
},{passive:true});
function draw(){duck.style.setProperty("--s",(1+heat*2.2).toFixed(3));bar.style.width=(heat*100)+"%";}
function cool(){const s=()=>{if(lock.classList.contains("on"))return;heat=Math.max(0,heat-.01);draw();if(heat>0)requestAnimationFrame(s)};requestAnimationFrame(s);}
document.getElementById("ok").onclick=()=>{lock.classList.remove("on");heat=0;draw();};
</script>
</body>
</html>
